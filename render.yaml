services:
  # 1. Le Backend (Laravel)
  - type: web
    name: bambadiante-backend
    env: docker
    dockerfilePath: ./backend/docker/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: APP_NAME
        value: BambaDiante
      - key: APP_ENV
        value: production
      - key: APP_KEY
        value: base64:g/ziyIjNp6G6TIKb1kgO38yHKyKUH4y39BqWEcE6L8M=
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://bambadiante-backend.onrender.com
      - key: FRONTEND_URL
        value: https://bambadiante.onrender.com
      - key: SANCTUM_STATEFUL_DOMAINS
        value: bambadiante.onrender.com
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: 120
      - key: SESSION_ENCRYPT
        value: "false"
      - key: SESSION_PATH
        value: /
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: bambadiante-db
          property: connectionString
      - key: FILESYSTEM_DISK
        value: s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: AWS_BUCKET
        value: bambadiante-uploads
      - key: AWS_ENDPOINT
        value: https://501fee40607ec3633638a315aea8d018.r2.cloudflarestorage.com
      - key: AWS_URL
        value: https://pub-4457a8b41b7b4ee389a380a2f38fcab6.r2.dev
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"

  # 2. Le Frontend (React en site statique)
  - type: web
    name: bambadiante
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://bambadiante-backend.onrender.com

databases:
  - name: bambadiante-db
    plan: free
    databaseName: bambadiante
    user: bambadiante